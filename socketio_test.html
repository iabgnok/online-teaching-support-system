<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketIO测试页面</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .messages { border: 1px solid #ddd; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .input-group { display: flex; gap: 10px; margin: 10px 0; }
        input, button { padding: 8px; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SocketIO 连接测试</h1>

        <div id="status" class="status disconnected">
            连接状态: 未连接
        </div>

        <div class="input-group">
            <input type="text" id="lessonId" placeholder="输入课堂ID" value="TEST123">
            <button onclick="joinClass()">加入课堂</button>
            <button onclick="leaveClass()">离开课堂</button>
        </div>

        <div class="input-group">
            <input type="text" id="message" placeholder="输入消息">
            <button onclick="sendMessage()">发送消息</button>
        </div>

        <div id="messages" class="messages"></div>

        <h2>画板测试</h2>
        <canvas id="canvas" width="400" height="300" style="border: 1px solid #ddd;"></canvas>
        <br>
        <button onclick="startDrawing()">开始绘制</button>
        <button onclick="clearCanvas()">清空画板</button>
    </div>

    <script>
        let socket;
        let canvas, ctx;
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function init() {
            // 初始化SocketIO
            socket = io('http://localhost:5000');

            // 连接状态监听
            socket.on('connect', () => {
                updateStatus('已连接', 'connected');
                addMessage('系统', '已连接到服务器');
            });

            socket.on('disconnect', () => {
                updateStatus('未连接', 'disconnected');
                addMessage('系统', '与服务器断开连接');
            });

            socket.on('connected', (data) => {
                addMessage('系统', 'SocketIO连接成功: ' + JSON.stringify(data));
            });

            socket.on('joined_class', (data) => {
                addMessage('系统', '成功加入课堂: ' + data.lesson_id);
            });

            socket.on('user_joined', (data) => {
                addMessage('系统', `${data.user_name} 加入了课堂`);
            });

            socket.on('user_left', (data) => {
                addMessage('系统', `用户 ${data.user_id} 离开了课堂`);
            });

            socket.on('drawing_update', (data) => {
                drawFromServer(data);
            });

            socket.on('new_message', (data) => {
                addMessage(data.user_name || '未知用户', data.message);
            });

            socket.on('error', (error) => {
                addMessage('错误', error.message);
            });

            // 初始化画板
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);
        }

        function updateStatus(text, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '连接状态: ' + text;
            statusEl.className = 'status ' + className;
        }

        function addMessage(user, message) {
            const messagesEl = document.getElementById('messages');
            const time = new Date().toLocaleTimeString();
            messagesEl.innerHTML += `<div><strong>${user}</strong> [${time}]: ${message}</div>`;
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function joinClass() {
            const lessonId = document.getElementById('lessonId').value;
            if (!lessonId) {
                alert('请输入课堂ID');
                return;
            }

            socket.emit('join_class', {
                lesson_id: lessonId,
                user_id: 'test_user_' + Math.floor(Math.random() * 1000),
                user_name: '测试用户'
            });
        }

        function leaveClass() {
            const lessonId = document.getElementById('lessonId').value;
            socket.emit('leave_class', {
                lesson_id: lessonId,
                user_id: 'test_user'
            });
        }

        function sendMessage() {
            const message = document.getElementById('message').value;
            const lessonId = document.getElementById('lessonId').value;

            if (!message || !lessonId) {
                alert('请输入消息和课堂ID');
                return;
            }

            socket.emit('chat_message', {
                lesson_id: lessonId,
                user_id: 'test_user',
                message: message
            });

            document.getElementById('message').value = '';
        }

        // 画板功能
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }

        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 本地绘制
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 发送到服务器
            const lessonId = document.getElementById('lessonId').value;
            socket.emit('drawing', {
                lesson_id: lessonId,
                user_id: 'test_user',
                x: x / canvas.width,
                y: y / canvas.height,
                prevX: lastX / canvas.width,
                prevY: lastY / canvas.height,
                color: '#000000',
                brush_size: 2,
                action: 'draw'
            });

            lastX = x;
            lastY = y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function drawFromServer(data) {
            const x = data.x * canvas.width;
            const y = data.y * canvas.height;
            const prevX = data.prevX ? data.prevX * canvas.width : x;
            const prevY = data.prevY ? data.prevY * canvas.height : y;

            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = data.color || '#000000';
            ctx.lineWidth = data.brush_size || 2;
            ctx.stroke();
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
